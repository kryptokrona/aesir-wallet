name: Aesir Release Pipeline

on:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{steps.create_release.outputs.upload_url}}
      
    
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: false

  build:
    name: "Build: ${{ matrix.config.name }} / ${{ matrix.config.platform }}"
    runs-on: ${{ matrix.config.os }}
    needs: [create-release]

    strategy:
      fail-fast: true
      matrix:
        config:
          # engine_os / engine_arch / engine_ext map this runner to the matching
          # xkr-swap-core release archive (e.g. swap_<tag>_Windows_x86_64.zip);
          # engine_exe is the binary suffix inside it.
          - {
            name: "Windows Latest",
            os: windows-latest,
            platform: x64,
            engine_os: Windows,
            engine_arch: x86_64,
            engine_ext: zip,
            engine_exe: ".exe"
          }
          - {
            name: "Ubuntu Latest",
            os: ubuntu-latest,
            platform: x64,
            engine_os: Linux,
            engine_arch: x86_64,
            engine_ext: tar,
            engine_exe: ""
          }
          - {
            name: "macOS arm64",
            os: macos-latest,
            platform: arm64,
            engine_os: Darwin,
            engine_arch: aarch64,
            engine_ext: tar,
            engine_exe: ""
          }

    env:
      PLATFORM: ${{ matrix.config.platform }}
      VERSION: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.11

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 18.13.0

      - name: Install python-setuptools on macOS
        if: matrix.config.os == 'macos-11' || matrix.config.os == 'macos-latest'
        run: brew install python-setuptools

      - name: Install snap on Linux
        if: matrix.config.os == 'ubuntu-latest'
        run: sudo snap install snapcraft --classic

      - name: Install libudev on Linux
        if: matrix.config.os == 'ubuntu-latest'
        run: sudo apt-get install -y libudev-dev

      - name: Install the Apple certificate
        if: matrix.config.os == 'macos-latest'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security find-identity -p codesigning -v

      - name: Install dependencies
        run: npm install --quiet

      # Bundle the swap engine: pull the latest xkr-swap-core release's `swap`
      # and `asb` binaries for THIS platform into bin/, where electron-builder
      # picks them up via extraResources ("bin/*"). Without this the packaged
      # wallet ships with no swap engine. bsdtar (default `tar` on all three
      # runners) extracts both .tar and Windows .zip archives.
      - name: Bundle swap engine binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_OS: ${{ matrix.config.engine_os }}
          ENGINE_ARCH: ${{ matrix.config.engine_arch }}
          ENGINE_EXT: ${{ matrix.config.engine_ext }}
          ENGINE_EXE: ${{ matrix.config.engine_exe }}
        run: |
          set -euo pipefail
          mkdir -p bin dl
          for b in swap asb; do
            echo "Downloading latest ${b} for ${ENGINE_OS}_${ENGINE_ARCH}…"
            gh release download --repo kryptokrona/xkr-swap-core \
              --pattern "${b}_*_${ENGINE_OS}_${ENGINE_ARCH}.${ENGINE_EXT}" \
              --dir dl --clobber
          done
          # Extract with Python (present via setup-python) so both .tar and
          # Windows .zip work the same regardless of which `tar` is on PATH.
          python - <<'PY'
          import glob, tarfile, zipfile, os
          for f in glob.glob("dl/*.tar") + glob.glob("dl/*.zip"):
              if f.endswith(".tar"):
                  with tarfile.open(f) as a: a.extractall("dl")
              else:
                  with zipfile.ZipFile(f) as a: a.extractall("dl")
              print("extracted", f)
          PY
          mv "dl/swap${ENGINE_EXE}" "bin/swap${ENGINE_EXE}"
          mv "dl/asb${ENGINE_EXE}"  "bin/asb${ENGINE_EXE}"
          chmod +x "bin/swap${ENGINE_EXE}" "bin/asb${ENGINE_EXE}" || true
          echo "Bundled engine binaries:"; ls -la bin/swap* bin/asb*

      - name: Build ${{ matrix.config.name }}
        if: matrix.config.os == 'windows-latest'
        run: npm run build:win-x64

      - name: Build ${{ matrix.config.name }}
        if: matrix.config.os == 'ubuntu-latest'
        run: npm run build:linux-$PLATFORM

      - name: Build ${{ matrix.config.name }}
        if: matrix.config.os == 'macos-latest'
        env:
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
        run: npm run build:mac-$PLATFORM
